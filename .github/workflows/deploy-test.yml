name: deploy

on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checking-out latest source
        uses: actions/checkout@v4
      - name: Setting up nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enabling corepack
        run: corepack enable
      - name: Installing node modules
        run: yarn install --immutable
      - name: Checking types
        run: yarn typecheck
      - name: Linting
        run: yarn lint
      - name: Checking formatting
        run: yarn prettier --check .
      - name: Running tests
        run: yarn test
      - name: Building the api and the client
        run: yarn build
        env:
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
      - name: Assembling the deployment
        run: |
          mkdir -p deploy
          cp -r apps/api/dist/. deploy/
          cp -r apps/web/dist/public deploy/public
          mkdir -p deploy/vendor/shared
          cp packages/shared/package.json deploy/vendor/shared/
          cp -r packages/shared/dist deploy/vendor/shared/dist
          cp apps/api/deploy-entry.cjs deploy/index.js
          node -e '
            const pkg = require("./apps/api/package.json");
            const shared = require("./packages/shared/package.json");
            delete pkg.devDependencies;
            pkg.main = "index.js";
            pkg.scripts = { start: "node index.js" };
            for (const [name, range] of Object.entries(pkg.dependencies)) {
              if (range.startsWith("workspace:")) delete pkg.dependencies[name];
            }
            pkg.dependencies = Object.fromEntries(
              Object.entries({ ...pkg.dependencies, ...shared.dependencies }).sort(
                ([a], [b]) => a.localeCompare(b),
              ),
            );
            require("fs").writeFileSync(
              "deploy/package.json",
              JSON.stringify(pkg, null, 2) + "\n",
            );
          '
      - name: Force restart post upload
        run: mkdir -p deploy/tmp && echo $EPOCHSECONDS > deploy/tmp/restart.txt
      - name: Uploading files to server
        if: github.event_name == 'push'
        uses: SamKirkland/FTP-Deploy-Action@4.0.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
