services:
  postgres:
    image: postgres:17
    container_name: tamil-baby-names-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-tamil-baby-names_db}
      POSTGRES_USER: ${POSTGRES_USER:-tbn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Drop the dump in as docker/initdb/seed.sql; *.sql here runs once, on an
      # empty data directory.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-tbn} -d ${POSTGRES_DATABASE:-tamil-baby-names_db}',
        ]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
