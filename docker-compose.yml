services:
    mariadb:
        image: mariadb:11
        container_name: tamil-baby-names-db
        restart: unless-stopped
        environment:
            MARIADB_DATABASE: ${MYSQL_DATABASE:-tamil-baby-names_db}
            MARIADB_ROOT_PASSWORD: ${MYSQL_PASSWORD:-devpass}
        ports:
            - '${MYSQL_PORT:-3306}:3306'
        volumes:
            - mariadb-data:/var/lib/mysql
            # Drop the DB dump in as docker/initdb/seed.sql.
            - ./docker/initdb:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test:
                ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
            interval: 5s
            timeout: 5s
            retries: 12

volumes:
    mariadb-data:
